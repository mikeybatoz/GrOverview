name: Report a problem
description: Report an installation or application problem.
body:
  - type: markdown
    attributes:
      value: Do not include passwords, API keys, tokens, private records or unredacted backups.
  - type: input
    id: version
    attributes:
      label: GrOverview and Home Assistant versions
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce and device model, if relevant
    validations:
      required: true
